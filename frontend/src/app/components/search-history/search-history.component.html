<div class="search-history-container">
  <form (ngSubmit)="onSearch()" class="search-form">
    <mat-form-field appearance="outline" class="search-field" hideRequiredMarker subscriptSizing="dynamic">
      <mat-label>Movie title</mat-label>
      <input [errorStateMatcher]="neverErrorStateMatcher"
             [formControl]="queryControl"
             matInput
             type="text"
      />
      @if (queryFilter()) {
        <button (click)="onClear()"
                aria-label="Clear search"
                mat-icon-button
                matSuffix
                type="button">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
    <button [disabled]="queryControl.invalid || isActionPending()" matButton="filled" type="submit">Search</button>
  </form>

  <h3 id="history-heading">Recent Searches</h3>
  @if (filteredHistory().length > 0) {
    <mat-action-list aria-labelledby="history-heading" class="history-list">
      @for (item of filteredHistory(); track item.id) {
        <button (click)="onSelect(item)"
                [attr.aria-disabled]="isActionPending()"
                mat-list-item
                type="button">
          <span matListItemTitle>{{ item.query }}</span>
          <small matListItemMeta>{{ item.lastSeenAt | date: (isDateToday(item.lastSeenAt) ? 'mediumTime' : 'mediumDate') }}</small>
        </button>
      }
    </mat-action-list>
  } @else {
    <p>No recent searches</p>
  }
</div>
