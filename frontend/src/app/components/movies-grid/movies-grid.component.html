<div class="movies-grid">
  @for (movie of movies(); track movie.id) {
    <mat-card appearance="outlined" class="movie-card">
      @if (isValidUrl(movie.poster)) {
        <img
          [alt]="movie.title + ' poster'"
          [ngSrc]="movie.poster"
          class="movie-poster"
          height="450"
          mat-card-image
          width="300"
        />
      } @else {
        <div
          [attr.aria-label]="movie.title + ' poster unavailable'"
          class="movie-poster movie-poster-placeholder"
          mat-card-image
          role="img"
        >
          <mat-icon aria-hidden="true">image_not_supported</mat-icon>
        </div>
      }
      <mat-card-header>
        <mat-card-title>{{ movie.title }}</mat-card-title>
        <mat-card-subtitle>{{ movie.year }} &middot; {{ movie.type }}</mat-card-subtitle>
      </mat-card-header>
    </mat-card>
  } @empty {
    @if (!loading()) {
      <p>No movies found</p>
    }
  }
</div>
